<template>
    <section class="panel">
        <lightning-input type="file" label="CSV file" accept=".csv" onchange={handleFileChange}></lightning-input>
        <div class="actions">
            <lightning-button variant="brand" label="Upload" onclick={upload} disabled={uploadDisabled}></lightning-button>
        </div>
        <template if:true={fileName}>
            <p class="muted">{fileName}</p>
        </template>
        <template if:true={message}>
            <p>{message}</p>
        </template>
    </section>
</template>
